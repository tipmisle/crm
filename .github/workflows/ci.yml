name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      # phpunit.xml already forces DB_CONNECTION=sqlite (:memory:),
      # QUEUE_CONNECTION=sync, CACHE_STORE=array, SESSION_DRIVER=array,
      # MAIL_MAILER=array and fake Stripe test keys — no external services
      # or real credentials are needed to run the suite.
      - name: Run PHP test suite
        run: php -d memory_limit=1G artisan test

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      # Runs vue-tsc (type check) then vite build — fails the build on any
      # TypeScript error, matching what `npm run build` does locally.
      - name: Type-check and build
        run: npm run build
